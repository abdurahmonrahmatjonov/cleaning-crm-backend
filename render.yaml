services:
  - type: web
    name: bis-newcrm-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: APP_TIMEZONE
        value: Asia/Tashkent
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
